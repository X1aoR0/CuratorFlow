server {
    listen 8765;
    server_name _;
    root /mnt/curator-flow/results-gallery;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/clips/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/metas/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
