project:
  name: curator-flow
  pipeline_version: v1

cluster:
  expected_cpu_nodes: 3
  expected_gpu_nodes: 1
  head_reserved_cpus: 2

storage:
  data_root: /data/curator-flow
  work_root: /data/curator-flow-work
  checkpoint_root: /data/curator-flow-checkpoints
  ray_spill_root: /data/ray-spill
  max_disk_usage_percent: 80

execution:
  backend: xenna
  mode: streaming
  autoscale_interval_s: 180
  cpu_allocation_percentage: 0.75

data:
  target_shard_size_mb: 512
  shards_per_file_group_task: 4
  image_batch_size: 64

gpu:
  enabled: true
  clip_batch_size_candidates: [8, 16, 32, 64]
  embedding_dtype: float16

