[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curator-flow"
version = "0.1.0"
description = "Multimodal pretraining data curation pipeline built on NeMo Curator, Xenna, and Ray"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]
video = [
  "nemo-curator[video_cpu]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

